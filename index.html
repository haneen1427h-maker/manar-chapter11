<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف المهمة - منار العلم</title>

<style>
:root{
    box-sizing:border-box;
    --bg:#fff;
    --ink:#2d4a7a;
    --card:#f4f8fd;
    --line:#b7c9e4;
    --chip:#cfdcf2;
    --ic:#dfe8e0;
    --head1:#3a5c92;
    --head2:#fff;
}

*{box-sizing:border-box;}

html{
    scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;
}

header{
    background:linear-gradient(var(--head1),var(--head2));
    padding:28px 20px 40px;
    text-align:center;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:960px;
    margin:0 auto;
    direction:ltr;
    gap:12px;
    flex-wrap:wrap;
}

.big{
    font-size:clamp(28px,6vw,52px);
    font-weight:900;
    color:#1c2f57;
    line-height:1;
    text-align:left;
    font-family:Impact,"Arial Black",sans-serif;
    letter-spacing:1px;
}

.big span{
    display:inline-block;
    background:#bcd0f0;
    padding:4px 14px;
    font-size:.45em;
    margin-top:6px;
    font-family:Arial,sans-serif;
    letter-spacing:2px;
}

.logos{
    font-weight:700;
    font-size:14px;
    text-align:center;
    color:#1c2f57;
    border:2px dashed var(--line);
    padding:10px 14px;
    border-radius:12px;
}

.title{
    display:inline-block;
    margin-top:20px;
    background:#fbf4e6;
    color:#2d4a7a;
    padding:8px 26px;
    border-radius:12px;
    font-weight:800;
    font-size:20px;
}

main{
    max-width:960px;
    margin:-10px auto 0;
    padding:20px 14px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;
}

.card{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:6px 24px 6px 6px;
    padding:30px 12px 12px;
}

.tag{
    position:absolute;
    top:-12px;
    left:14px;
    direction:ltr;
    background:var(--bg);
    border:2px solid var(--ink);
    padding:1px 10px;
    font-weight:800;
    font-size:13px;
    transform:rotate(-4deg);
    font-family:Arial,sans-serif;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.ic{
    flex:none;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--ic);
    display:grid;
    place-items:center;
    font-size:18px;
}

.f{
    flex:1;
    position:relative;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 12px 8px;
    min-height:50px;
    font-size:14px;
    border-bottom:1px dashed var(--line);
}

.f b{
    position:absolute;
    top:-9px;
    right:10px;
    background:var(--chip);
    color:var(--ink);
    font-size:11px;
    padding:1px 10px;
    border-radius:6px;
}

.f input{
    width:100%;
    border:0;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:14px;
    outline:none;
    padding:0;
}

.dl{
    grid-column:1/-1;
    max-width:420px;
    margin:0 auto;
    width:100%;
}

#st{
    text-align:center;
    font-size:12px;
    opacity:.7;
    padding-bottom:20px;
}

.assignment{
    max-width:900px;
    margin:10px auto 35px;
    padding:25px 18px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:20px;
}

.assignment-title{
    text-align:center;
    margin:0 0 8px;
    font-size:22px;
}

.assignment-subtitle{
    text-align:center;
    font-size:14px;
    opacity:.75;
    margin-bottom:22px;
}

.assignment-box{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.assignment-box select,
.assignment-box input{
    padding:12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    outline:none;
}

.assignment-box select{min-width:250px;}
.assignment-box input{width:200px;}

.assign-btn{
    padding:12px 20px;
    border:0;
    border-radius:10px;
    background:#3a5c92;
    color:white;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
}

.assign-btn:hover{opacity:.9;}

#message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:700;
}

.mission-results{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
}

.mission-result{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
}

.mission-result strong{
    display:block;
    margin-bottom:6px;
}

.available{
    color:#6c8f68;
    font-size:13px;
}

.taken{
    color:#3a5c92;
    font-weight:700;
}

.template-section{
    max-width:900px;
    margin:0 auto 50px;
    padding:25px 18px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:20px;
    text-align:center;
}

.template-title{
    margin:0 0 8px;
    font-size:22px;
}

.template-subtitle{
    font-size:14px;
    opacity:.75;
    margin-bottom:20px;
}

.template-link{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:160px;
    margin:0 auto;
    padding:18px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:16px;
    text-decoration:none;
    color:var(--ink);
    transition:transform .2s,background .2s;
}

.template-link:hover{
    transform:translateY(-4px);
    background:#edf3fc;
}

.template-icon{
    width:65px;
    height:65px;
    border-radius:18px;
    background:#dfe8f7;
    display:grid;
    place-items:center;
    font-size:32px;
}

.template-link strong{font-size:15px;}
.template-link span{font-size:12px;opacity:.7;}

@media(max-width:600px){
    main{grid-template-columns:1fr;}
    .assignment-box{flex-direction:column;}

    .assignment-box select,
    .assignment-box input,
    .assign-btn{
        width:100%;
        max-width:350px;
    }
}
</style>
</head>

<body>

<header>
    <div class="top">
        <div class="logos">
            <span style="color:#bcd0f0;">مَنار العِلم EL MANAR</span>
        </div>

        <div class="big">
            CONFIDENTIAL <br>
            <span>TEAM MISSION</span>
        </div>
    </div>

    <div class="title">☆ ملف المهمة ☆</div>
</header>

<main id="m"></main>

<div id="st"></div>

<section class="assignment">

    <h2 class="assignment-title">🎯 استلام المهمة</h2>

    <div class="assignment-subtitle">
        اختاري المهمة المناسبة لك واكتبي اسمك لاستلامها 🤍
    </div>

    <div class="assignment-box">

        <select id="missionSelect">
            <option value="">اختاري المهمة</option>
            <option value="شرح الشابتر الحادي عشر">شرح الشابتر الحادي عشر</option>
            <option value="ملخص الشابتر الحادي عشر">ملخص الشابتر الحادي عشر</option>
            <option value="كويز الشابتر الحادي عشر">كويز الشابتر الحادي عشر</option>
            <option value="تدقيق شرح الشابتر الحادي عشر">تدقيق شرح الشابتر الحادي عشر</option>
            <option value="تدقيق ملخص الشابتر الحادي عشر">تدقيق ملخص الشابتر الحادي عشر</option>
            <option value="تدقيق كويز الشابتر الحادي عشر">تدقيق كويز الشابتر الحادي عشر</option>
        </select>

        <input
            type="text"
            id="assignName"
            maxlength="50"
            placeholder="اكتبي اسمك هنا"
        >

        <button class="assign-btn" onclick="assignMission()">
            استلام المهمة
        </button>

    </div>

    <div id="message"></div>

    <div id="missionsList" class="mission-results"></div>

</section>

<section class="template-section">

    <h2 class="template-title">📚 قالب الملخص</h2>

    <div class="template-subtitle">
        اضغطي على الأيقونة للوصول إلى قالب الملخص
    </div>

    <a
        class="template-link"
        href="https://canva.link/dd9z5n0jnbdfitl"
        target="_blank"
        rel="noopener noreferrer"
    >
        <div class="template-icon">📄</div>
        <strong>قالب الملخص</strong>
        <span>اضغطي لفتح القالب</span>
    </a>

</section>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import { getAnalytics } from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// Firebase - manar-team11

const firebaseConfig = {
    apiKey: "AIzaSyCJ8QcC8Df4X084w0p7xM4jWDWe960bp-U",
    authDomain: "manar-team11.firebaseapp.com",
    projectId: "manar-team11",
    storageBucket: "manar-team11.firebasestorage.app",
    messagingSenderId: "121233038585",
    appId: "1:121233038585:web:528c71a86680e6cc2e9628",
    measurementId: "G-P8E69002DY"
};


// تهيئة Firebase

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

try {
    getAnalytics(app);
} catch(error) {
    console.warn("Analytics غير متاح:", error);
}


// أسماء المهام

const missionDetails = [
    "شرح الشابتر الحادي عشر",
    "ملخص الشابتر الحادي عشر",
    "كويز الشابتر الحادي عشر",
    "تدقيق شرح الشابتر الحادي عشر",
    "تدقيق ملخص الشابتر الحادي عشر",
    "تدقيق كويز الشابتر الحادي عشر"
];


// إنشاء بطاقات المهام

let h = "";

for(let i = 1; i <= 6; i++){

    h += `
    <section class="card">

        <div class="tag">MISSION #0${i}</div>

        <div class="row">
            <div class="ic">🎯</div>
            <div class="f">
                <b>رقم المهمة:</b>
                <div>#0${i}</div>
            </div>
        </div>

        <div class="row">
            <div class="ic">📝</div>
            <div class="f">
                <b>المطلوب:</b>
                <div>${missionDetails[i-1]}</div>
            </div>
        </div>

        <div class="row">
            <div class="ic">👤</div>
            <div class="f">
                <b>المسؤول:</b>
                <input
                    type="text"
                    id="missionPerson${i}"
                    placeholder="سيظهر اسم المسؤول هنا"
                    readonly
                >
            </div>
        </div>

    </section>
    `;
}


// بطاقة الموعد النهائي

h += `
<section class="card dl">

    <div class="tag">DEADLINE</div>

    <div class="row">
        <div class="ic">⏰</div>

        <div class="f">
            <b>الموعد النهائي:</b>
            <input
                type="text"
                value="٤ - ٦ - ١٤٤٨ هـ | 14 - 11 - 2026 م"
                readonly
            >
        </div>
    </div>

</section>
`;

document.getElementById("m").innerHTML = h;


// استلام المهمة

window.assignMission = async function(){

    const mission =
        document.getElementById("missionSelect").value.trim();

    const name =
        document.getElementById("assignName").value.trim();

    const message =
        document.getElementById("message");


    if(!mission){
        message.textContent = "⚠️ اختاري المهمة أولاً.";
        return;
    }

    if(!name){
        message.textContent = "⚠️ اكتبي اسمك أولاً.";
        return;
    }

    message.textContent =
        "⏳ جاري تسجيل المهمة في قاعدة البيانات...";

    try {

        const querySnapshot =
            await getDocs(collection(db, "missions"));

        let alreadyTaken = false;

        querySnapshot.forEach((doc) => {

            const data = doc.data();

            if(data.mission && data.mission.trim() === mission){
                alreadyTaken = true;
            }

        });


        if(alreadyTaken){

            message.textContent =
                "⚠️ هذه المهمة تم استلامها مسبقًا.";

            await loadMissions();
            return;
        }


        await addDoc(collection(db, "missions"), {

            mission: mission,
            name: name,
            timestamp: new Date()

        });


        message.textContent =
            "✅ تم تسجيل اسمك واستلام المهمة بنجاح!";

        document.getElementById("assignName").value = "";
        document.getElementById("missionSelect").value = "";

        await loadMissions();


    } catch(error){

        console.error("خطأ أثناء الحفظ:", error);

        message.textContent =
            "❌ حدث خطأ أثناء الحفظ، تأكدي من الاتصال وإعدادات قاعدة البيانات.";

    }

};


// تحميل المهام من Firestore

async function loadMissions(){

    try {

        const querySnapshot =
            await getDocs(collection(db, "missions"));

        const data = [];

        querySnapshot.forEach((doc) => {
            data.push(doc.data());
        });


        const list =
            document.getElementById("missionsList");

        list.innerHTML = "";


        missionDetails.forEach(function(mission, index){

            const row = data.find(function(item){

                return item.mission &&
                    item.mission.trim() === mission &&
                    item.name &&
                    item.name.trim();

            });


            const div = document.createElement("div");
            div.className = "mission-result";

            const strong = document.createElement("strong");
            strong.textContent = "📌 " + mission;
            div.appendChild(strong);

            const status = document.createElement("span");

            if(row){

                status.className = "taken";
                status.textContent = "👤 المسؤول: " + row.name;

            } else {

                status.className = "available";
                status.textContent = "✓ المهمة متاحة للاستلام";

            }

            div.appendChild(status);
            list.appendChild(div);


            const personInput =
                document.getElementById("missionPerson" + (index + 1));

            if(personInput){

                personInput.value = row
                    ? row.name
                    : "لم يتم استلام المهمة بعد";

            }

        });


    } catch(error){

        console.error("خطأ أثناء تحميل البيانات:", error);

        document.getElementById("st").textContent =
            "تعذر تحميل المهام، تأكدي من إعدادات Firebase.";

    }

}


// تحميل البيانات عند فتح الصفحة

loadMissions();

</script>

</body>
</html>
